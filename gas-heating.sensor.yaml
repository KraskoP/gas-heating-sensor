# Board: Generic ESP32 Board (Generic)

esphome:
  name: gas-heating-sensor
  friendly_name: gas-heating-sensor

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "VqSWAhG7adWKL5frOqujOyhYt+YiClVRcPkb2o5lqso="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: gas-heating
    password: "Ov9R4LQKpiKC"

captive_portal:

web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_server_username
    password: !secret web_server_password 
    type: digest   
  
  # Konfiguracja magistrali 1-Wire dla czujników Dallas
one_wire:
  - platform: gpio
    pin: GPIO4

# Definicja wbudowanej diody LED jako wyjścia binarnego
output:
  - platform: ledc
    pin: 
      number: GPIO2
      inverted: false  # Wbudowane diody w ESP32 często zapalają się przy stanie LOW
      ignore_strapping_warning: true
    id: onboard_led

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    id: gas_pulse_input
    name: "Stan Kontraktonu Gazu"
    # Ta sekcja reaguje natychmiast na każde fizyczne zwarcie styku licznika
    on_release:
      then:
        - output.turn_on: onboard_led
        - delay: 500ms
        - output.turn_off: onboard_led
    
sensor:
  # Czujniki temperatury
  - platform: dallas_temp
    address: 0x523c25f649de7f28
    name: "Temperatura CWU"
    id: temp_CWU
    icon: "mdi:water-thermometer"

  - platform: dallas_temp
    address: 0x873c34f6495a9f28
    name: "Temperatura wyjście"
    id: temp_output
    icon: "mdi:thermometer-chevron-up"
    
  - platform: dallas_temp
    address: 0x33000000368c9128
    name: "Temperatura powrót"
    id: temp_input
    icon: "mdi:thermometer-chevron-down"